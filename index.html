<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Systems & Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Confetti Library for Animations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #22c55e;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* Quote / Affirmation Box */
        .quote-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .quote-box p {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 500;
        }

        /* Analytics Dashboard */
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Systems Section */
        .systems-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .system-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .system-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .system-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .system-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Days Grid inside Card */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        @media (max-width: 600px) {
            .days-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }

        .day-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .day-box:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .day-box .day-num {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .day-box .day-status {
            font-size: 0.9rem;
        }

        .day-box.completed {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--accent-green);
            animation: pulseCheck 0.4s ease;
        }

        .day-box.completed .day-status {
            color: var(--accent-green);
            font-weight: bold;
        }

        @keyframes pulseCheck {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Colors for different systems */
        .sys-1 .dot { background-color: var(--accent-green); }
        .sys-2 .dot { background-color: var(--accent-pink); }
        .sys-3 .dot { background-color: var(--accent-orange); }
        .sys-4 .dot { background-color: var(--accent-yellow); }
        .sys-5 .dot { background-color: var(--accent-blue); }

        /* Motivation Popup / Toast */
        #toast {
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            bottom: 50px;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .reset-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MY SYSTEMS</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Consistency is the key to mastery.</p>
        </header>

        <!-- Affirmation Box -->
        <div class="quote-box">
            <p>✨ "Today is best. I am in discipline. I am focused. I will complete all the tasks today."</p>
        </div>

        <!-- Analytics Dashboard -->
        <div class="analytics-grid">
            <div class="stat-card">
                <h3>Total Done</h3>
                <div class="value" id="totalDone">0</div>
            </div>
            <div class="stat-card">
                <h3>Completion Rate</h3>
                <div class="value" id="completionRate">0%</div>
            </div>
            <div class="stat-card">
                <h3>Consistency Streak</h3>
                <div class="value" id="streakCount">0 Days</div>
            </div>
        </div>

        <!-- Systems List (14 Days Grid for each system) -->
        <div class="systems-container" id="systemsContainer">
            <!-- Dynamically generated via JavaScript -->
        </div>

        <div class="footer-actions">
            <button class="action-btn" onclick="markTodayAll()">Check Today's All</button>
            <button class="action-btn reset-btn" onclick="resetData()">Reset All Data</button>
        </div>
    </div>

    <!-- Motivational Toast Notification -->
    <div id="toast">🔥 Great job! Keep pushing forward!</div>

    <script>
        const systems = [
            { id: 'sys1', name: '1H T. Analysis', class: 'sys-1' },
            { id: 'sys2', name: 'Book Reading!', class: 'sys-2' },
            { id: 'sys3', name: 'Follow Systems!', class: 'sys-3' },
            { id: 'sys4', name: '2-3 Hours Study!', class: 'sys-4' },
            { id: 'sys5', name: 'Daily Sketch Work!', class: 'sys-5' }
        ];

        const TOTAL_DAYS = 14; // Isko badha kar 30 bhi kar sakta hai

        // Load data from localStorage or initialize empty
        let trackerData = JSON.parse(localStorage.getItem('dev_systems_data')) || {};

        const motivationQuotes = [
            "🔥 Amazing progress! Discipline beats motivation every single time.",
            "🚀 Fantastic! You're one step closer to becoming a CA & master creator!",
            "⭐ Boom! Systems executed successfully. Keep the momentum going!",
            "🎯 Outstanding focus! Consistency is your superpower.",
            "💪 Great discipline today! Nothing can stop you now."
        ];

        function initApp() {
            const container = document.getElementById('systemsContainer');
            container.innerHTML = '';

            systems.forEach(sys => {
                if (!trackerData[sys.id]) {
                    trackerData[sys.id] = Array(TOTAL_DAYS).fill(false);
                }

                let card = document.createElement('div');
                card.className = `system-card ${sys.class}`;

                let headerHTML = `
                    <div class="system-header">
                        <div class="system-title">
                            <span class="dot"></span>
                            ${sys.name}
                        </div>
                    </div>
                `;

                let gridHTML = `<div class="days-grid">`;
                for (let i = 0; i < TOTAL_DAYS; i++) {
                    let isCompleted = trackerData[sys.id][i];
                    gridHTML += `
                        <div class="day-box ${isCompleted ? 'completed' : ''}" onclick="toggleDay('${sys.id}', ${i})">
                            <div class="day-num">D${i+1}</div>
                            <div class="day-status">${isCompleted ? '✓' : '·'}</div>
                        </div>
                    `;
                }
                gridHTML += `</div>`;

                card.innerHTML = headerHTML + gridHTML;
                container.appendChild(card);
            });

            updateAnalytics();
        }

        function toggleDay(sysId, dayIndex) {
            let currentState = trackerData[sysId][dayIndex];
            trackerData[sysId][dayIndex] = !currentState;
            localStorage.setItem('dev_systems_data', JSON.stringify(trackerData));

            // If checked (turned true), trigger animation & confetti!
            if (!currentState) {
                triggerCelebration();
            }

            initApp();
        }

        function triggerCelebration() {
            // Trigger Confetti
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Show Toast with random motivation
            const toast = document.getElementById('toast');
            const randomQuote = motivationQuotes[Math.floor(Math.random() * motivationQuotes.length)];
            toast.innerText = randomQuote;
            toast.className = 'show';
            setTimeout(() => {
                toast.className = '';
            }, 3000);
        }

        function updateAnalytics() {
            let totalBoxes = systems.length * TOTAL_DAYS;
            let doneCount = 0;

            Object.keys(trackerData).forEach(sysId => {
                trackerData[sysId].forEach(val => {
                    if (val) doneCount++;
                });
            });

            let percentage = Math.round((doneCount / totalBoxes) * 100);
            let estimatedStreak = Math.floor(doneCount / systems.length);

            document.getElementById('totalDone').innerText = doneCount;
            document.getElementById('completionRate').innerText = percentage + '%';
            document.getElementById('streakCount').innerText = estimatedStreak + ' Days';
        }

        function resetData() {
            if (confirm('Kya aap saara data reset karna chahte hain?')) {
                localStorage.removeItem('dev_systems_data');
                trackerData = {};
                initApp();
            }
        }

        initApp();
    </script>
</body>
</html>
